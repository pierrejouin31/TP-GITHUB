name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Titre present
        run: grep -q "<title>.\+</title>" site/index.html
      - name: Conf nginx valide
        run: |
          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Pas de bandeau promo
        run: if grep -q "PROMO" site/index.html; then exit 1; fi